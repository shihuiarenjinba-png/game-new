name: Prototype checks
on:
  push:
    branches:
      - prototype/handover-room-20261017
      - feature/psychological-mystery-v02-product-quality
      - feature/psychological-mystery-v03-evidence-depth
      - feature/handover-v04-deduction
      - feature/handover-v05-replayable-cases
      - feature/handover-v06-major-payoff-arcs
      - feature/handover-v07-causal-audit
      - feature/handover-v08-six-arcs
      - feature/handover-v09-character-reactions
      - feature/handover-v10-reading-windows-smoke
      - feature/handover-v11-accessibility-save-qa
      - feature/handover-v12-save-transfer-replay-qa
      - feature/handover-v13-hypothesis-revision
      - feature/handover-v14-consequence-simplicity
      - feature/handover-v15-local-qa-recovery
      - feature/handover-v16-clear-ui-msix-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run narrative regression
        run: npm test
      - name: Report objective six-route text volume
        run: npm run audit:story-volume

  windows-edge:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify six routes in Windows Edge
        run: node scripts/windows-edge-smoke.cjs
      - name: Verify native keyboard and reload under display scaling
        run: node scripts/windows-edge-accessibility.cjs
      - name: Verify exported and imported local backup round-trip
        run: node scripts/windows-edge-save-transfer.cjs
