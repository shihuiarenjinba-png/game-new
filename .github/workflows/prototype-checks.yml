name: Prototype checks
on:
  push:
    branches:
      - prototype/handover-room-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run narrative regression
        run: npm test
