name: Handover Room commercial regression
on:
  push:
    branches: ["feature/commercial-first-play-ux-20261018"]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: All Node regression tests
        run: npm test
      - name: Story volume audit
        run: npm run audit:story-volume
